<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1/64 Matematik Garajı</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00d2ff;
            --secondary-color: #3a7bd5;
            --accent-color: #ff3366;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --success: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(135deg, var(--surface-color), #2a2a2a);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: -webkit-linear-gradient(var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #0a0a0a;
            font-weight: bold;
            font-size: 14px;
        }

        .kp-badge {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        main {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 70px; /* Space for bottom nav */
        }

        /* Views */
        .view {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Question Arena */
        .question-card {
            background-color: var(--surface-color);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .question-text {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background-color: #2a2a2a;
            color: white;
            border: 2px solid #444;
            padding: 15px 10px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .option-btn.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: #000;
        }

        .option-btn.wrong {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }

        /* Market & Garage Grids */
        .car-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .car-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .car-emoji {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .car-brand {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .car-name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 40px;
        }

        .buy-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        
        .buy-btn:active {
            background-color: var(--primary-color);
            color: #000;
        }

        .buy-btn.disabled {
            border-color: #555;
            color: #555;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: space-around;
            padding: 15px 0 calc(15px + env(safe-area-inset-bottom));
            border-top: 1px solid #333;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-icon {
            font-size: 24px;
        }

        /* Feedback Toast */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            opacity: 1;
        }

        .empty-garage {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <header>
        <h1>1/64 Matematik Garajı</h1>
    </header>

    <div class="status-bar">
        <span>Koleksiyoner Profili</span>
        <div class="kp-badge">
            <span id="score">0</span> KP
        </div>
    </div>

    <main>
        <!-- SORULAR EKRANI -->
        <div id="view-soru" class="view active">
            <div class="question-card">
                <div id="q-text" class="question-text">Soru yükleniyor...</div>
                <div class="options-grid" id="options-container">
                    <!-- Butonlar JS ile gelecek -->
                </div>
                <button id="next-btn" class="next-btn" onclick="loadNewQuestion()">Sonraki Soru ➔</button>
            </div>
            <p style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 10px;">
                Doğru cevaplar zorluğuna göre 10-50 KP kazandırır.
            </p>
        </div>

        <!-- PAZAR EKRANI -->
        <div id="view-pazar" class="view">
            <h2 style="margin-bottom: 15px; font-size: 18px;">Araç Pazarı</h2>
            <div class="car-grid" id="market-grid">
                <!-- Pazar JS ile dolacak -->
            </div>
        </div>

        <!-- GARAJ EKRANI -->
        <div id="view-garaj" class="view">
            <h2 style="margin-bottom: 15px; font-size: 18px;">Garajım</h2>
            <div style="background: var(--surface-color); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #333;">
                <p style="color: var(--text-muted); font-size: 12px;">Toplam Araç</p>
                <h3 id="total-cars" style="font-size: 24px; color: var(--primary-color);">0</h3>
            </div>
            <div class="car-grid" id="garage-grid">
                <!-- Garaj JS ile dolacak -->
            </div>
        </div>
    </main>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('soru', this)">
            <span class="nav-icon">📝</span>
            <span>Sorular</span>
        </div>
        <div class="nav-item" onclick="switchView('pazar', this)">
            <span class="nav-icon">🛒</span>
            <span>Pazar</span>
        </div>
        <div class="nav-item" onclick="switchView('garaj', this)">
            <span class="nav-icon">🏁</span>
            <span>Garajım</span>
        </div>
    </div>

    <div id="toast" class="toast">Harika! +20 KP</div>

    <script>
        // --- DATA ---
        let kp = 0;
        let garage = [];

        const marketCars = [
            { id: 1, brand: "Hot Wheels", name: "Mainline Custom Mustang", price: 150, emoji: "🚙" },
            { id: 2, brand: "Matchbox", name: "Moving Parts Porsche 911", price: 250, emoji: "🚗" },
            { id: 3, brand: "Majorette", name: "Premium Edition G-Class", price: 400, emoji: "🛻" },
            { id: 4, brand: "Greenlight", name: "Hollywood Film Aracı", price: 800, emoji: "🚐" },
            { id: 5, brand: "Mini GT", name: "Nissan Skyline GT-R R34", price: 1500, emoji: "🏎️" },
            { id: 6, brand: "Tomica", name: "Limited Vintage Neo Serisi", price: 2500, emoji: "🚔" },
            { id: 7, brand: "Inno64", name: "Honda Civic Type-R Sergilik", price: 3500, emoji: "🚘" },
            { id: 8, brand: "Hot Wheels", name: "Super Treasure Hunt (STH)", price: 5000, emoji: "🔥" }
        ];

        const brands = ["Hot Wheels", "Matchbox", "Greenlight", "Mini GT", "Corgi", "Jada", "Siku", "Tomica", "Majorette", "Inno64"];

        // --- NAVIGATION ---
        function switchView(viewId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('view-' + viewId).classList.add('active');
            el.classList.add('active');

            if(viewId === 'pazar') renderMarket();
            if(viewId === 'garaj') renderGarage();
        }

        // --- QUESTION ENGINE ---
        let currentCorrectAnswer = 0;
        let currentPoints = 0;
        let answered = false;

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion() {
            const types = [0, 1, 2, 3];
            const type = types[randInt(0, types.length - 1)];
            const brand = brands[randInt(0, brands.length - 1)];
            
            let qText = "";
            let answer = 0;
            let points = 0;

            if (type === 0) {
                // Oran Orantı (Ölçek)
                let lengthCM = randInt(5, 9);
                let realLength = lengthCM * 64;
                qText = `Gerçek uzunluğu ${realLength} cm olan bir otomobilin 1/64 ölçekli ${brand} modeli tam olarak kaç cm'dir?`;
                answer = lengthCM;
                points = 20;
            } 
            else if (type === 1) {
                // Yüzde ve Kar Problemi
                let cost = randInt(5, 20) * 10; // 50, 60, ... 200
                let profitRate = randInt(1, 5) * 100; // %100, %200...
                qText = `Bir avcı (hunter) raftan ${cost} TL'ye aldığı nadir bir ${brand} modelini, koleksiyoner pazarında %${profitRate} karla satıyor. Bu araç kaç TL'ye satılmıştır?`;
                answer = cost + (cost * (profitRate / 100));
                points = 40;
            }
            else if (type === 2) {
                // Alan / Hacim (Fotoblok Sergileme)
                let rows = randInt(4, 8);
                let cols = randInt(8, 15);
                let displays = randInt(2, 4);
                qText = `Fotobloktan yaptığın özel sergileme ünitesinde ${rows} raf var ve her raf ${cols} araç alıyor. Bu ünitelerden duvarına ${displays} adet asarsan toplam kaç 1/64 araç sergileyebilirsin?`;
                answer = rows * cols * displays;
                points = 30;
            }
            else if (type === 3) {
                // Dört İşlem
                let cases = randInt(3, 10);
                let perCase = randInt(2, 6) * 12; // 24, 36, 48, 72
                qText = `Bir hobi mağazasına ${cases} koli ${brand} sevkiyatı geldi. Her kolinin içinde ${perCase} adet araç bulunduğuna göre mağazaya toplam kaç araç gelmiştir?`;
                answer = cases * perCase;
                points = 25;
            }

            return { qText, answer, points };
        }

        function generateOptions(correctAnswer) {
            let opts = new Set();
            opts.add(correctAnswer);
            
            while(opts.size < 4) {
                let diff = randInt(-3, 3);
                if (diff === 0) diff = 5;
                
                // Cevabın büyüklüğüne göre şaşırtmaca üret
                let wrong;
                if (correctAnswer < 20) {
                    wrong = correctAnswer + diff;
                } else if (correctAnswer < 100) {
                    wrong = correctAnswer + (diff * 2);
                } else {
                    wrong = correctAnswer + (diff * 10);
                }

                if (wrong > 0) opts.add(wrong);
            }

            let arr = Array.from(opts);
            arr.sort(() => Math.random() - 0.5); // Karıştır
            return arr;
        }

        function loadNewQuestion() {
            answered = false;
            document.getElementById('next-btn').style.display = 'none';
            
            const qData = generateQuestion();
            currentCorrectAnswer = qData.answer;
            currentPoints = qData.points;
            
            document.getElementById('q-text').innerText = qData.qText;
            
            const options = generateOptions(qData.answer);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btnElement) {
            if (answered) return;
            answered = true;

            const buttons = document.querySelectorAll('.option-btn');
            
            if (selected === currentCorrectAnswer) {
                btnElement.classList.add('correct');
                updateKP(currentPoints);
                showToast(`Doğru! +${currentPoints} KP`, 'var(--success)');
            } else {
                btnElement.classList.add('wrong');
                showToast('Yanlış Cevap!', 'var(--accent-color)');
                // Doğruyu göster
                buttons.forEach(b => {
                    if (parseInt(b.innerText) === currentCorrectAnswer) {
                        b.classList.add('correct');
                    }
                });
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        // --- CORE LOGIC ---
        function updateKP(amount) {
            kp += amount;
            document.getElementById('score').innerText = kp;
            renderMarket(); // Pazardaki butonları güncelle
        }

        function showToast(msg, color) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.color = color;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }

        function renderMarket() {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';

            marketCars.forEach(car => {
                const canAfford = kp >= car.price;
                const btnClass = canAfford ? 'buy-btn' : 'buy-btn disabled';
                
                grid.innerHTML += `
                    <div class="car-card">
                        <div>
                            <div class="car-emoji">${car.emoji}</div>
                            <div class="car-brand">${car.brand}</div>
                            <div class="car-name">${car.name}</div>
                            <div style="font-weight: bold; color: var(--primary-color);">${car.price} KP</div>
                        </div>
                        <button class="${btnClass}" onclick="buyCar(${car.id})">
                            ${canAfford ? 'SATIN AL' : 'YETERSİZ KP'}
                        </button>
                    </div>
                `;
            });
        }

        function buyCar(id) {
            const car = marketCars.find(c => c.id === id);
            if (kp >= car.price) {
                updateKP(-car.price);
                garage.push({...car, buyDate: new Date()});
                showToast('Garaja Eklendi!', 'var(--primary-color)');
                renderGarage();
            }
        }

        function renderGarage() {
            const grid = document.getElementById('garage-grid');
            document.getElementById('total-cars').innerText = garage.length;
            grid.innerHTML = '';

            if (garage.length === 0) {
                grid.innerHTML = '<div class="empty-garage">Henüz hiç aracın yok. Soruları çöz, KP kazan ve pazar alanından ilk modelini al!</div>';
                return;
            }

            garage.slice().reverse().forEach((car, index) => {
                grid.innerHTML += `
                    <div class="car-card" style="border-color: var(--primary-color);">
                        <div>
                            <div class="car-emoji">${car.emoji}</div>
                            <div class="car-brand">${car.brand}</div>
                            <div class="car-name">${car.name}</div>
                            <div style="font-size: 10px; color: var(--text-muted);">Araç #${garage.length - index}</div>
                        </div>
                    </div>
                `;
            });
        }

        // Init
        loadNewQuestion();
        renderMarket();

    </script>
</body>
</html>
