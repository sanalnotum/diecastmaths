<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1/64 Matematik Garajı</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #00d2ff;
            --secondary-color: #3a7bd5;
            --accent-color: #ff3366;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --success: #00e676;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html { background-color: #000; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            position: relative;
        }
        header {
            background: linear-gradient(135deg, var(--surface-color), #2a2a2a);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
            position: relative;
            z-index: 10;
        }
        header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: -webkit-linear-gradient(var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #0a0a0a;
            font-weight: bold;
            font-size: 14px;
        }
        .kp-badge {
            background: rgba(0, 210, 255, 0.1);
            color: var(--primary-color);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .reset-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 10px;
            cursor: pointer;
        }
        main {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 70px;
        }
        .view {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .view.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .question-card {
            background-color: var(--surface-color);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .question-text {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .option-btn {
            background-color: #2a2a2a;
            color: white;
            border: 2px solid #444;
            padding: 15px 10px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:active { transform: scale(0.95); }
        .option-btn.correct { background-color: var(--success); border-color: var(--success); color: #000; }
        .option-btn.wrong { background-color: var(--accent-color); border-color: var(--accent-color); color: #fff; }
        .next-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            display: none;
        }
        .car-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .car-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .car-image {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #111; 
            border: 1px solid #444;
        }
        .car-brand {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .car-name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 38px;
        }
        .buy-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }
        .buy-btn:active { background-color: var(--primary-color); color: #000; }
        .buy-btn.disabled { border-color: #555; color: #555; cursor: not-allowed; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background-color: var(--surface-color);
            display: flex;
            justify-content: space-around;
            padding: 15px 0 calc(15px + env(safe-area-inset-bottom));
            border-top: 1px solid #333;
            z-index: 100;
        }
        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .nav-item.active { color: var(--primary-color); }
        .nav-icon { font-size: 24px; }
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
        .empty-garage {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <header><h1>1/64 Matematik Garajı</h1></header>
    <div class="status-bar">
        <span><button class="reset-btn" onclick="resetData()">Sıfırla</button></span>
        <div class="kp-badge"><span id="score">0</span> KP</div>
    </div>
    <main>
        <div id="view-soru" class="view active">
            <div class="question-card">
                <div id="q-text" class="question-text">Soru yükleniyor...</div>
                <div class="options-grid" id="options-container"></div>
                <button id="next-btn" class="next-btn" onclick="loadNewQuestion()">Sonraki Soru ➔</button>
            </div>
            <p style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 10px;">
                Doğru cevaplar zorluğuna göre 10-50 KP kazandırır.
            </p>
        </div>
        <div id="view-pazar" class="view">
            <h2 style="margin-bottom: 15px; font-size: 18px;">Araç Pazarı</h2>
            <div class="car-grid" id="market-grid"></div>
        </div>
        <div id="view-garaj" class="view">
            <h2 style="margin-bottom: 15px; font-size: 18px;">Garajım</h2>
            <div style="background: var(--surface-color); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 1px solid #333;">
                <p style="color: var(--text-muted); font-size: 12px;">Toplam Araç</p>
                <h3 id="total-cars" style="font-size: 24px; color: var(--primary-color);">0</h3>
            </div>
            <div class="car-grid" id="garage-grid"></div>
        </div>
    </main>
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('soru', this)">
            <span class="nav-icon">📝</span><span>Sorular</span>
        </div>
        <div class="nav-item" onclick="switchView('pazar', this)">
            <span class="nav-icon">🛒</span><span>Pazar</span>
        </div>
        <div class="nav-item" onclick="switchView('garaj', this)">
            <span class="nav-icon">🏁</span><span>Garajım</span>
        </div>
    </div>
    <div id="toast" class="toast">Harika! +20 KP</div>

    <script>
        let kp = parseInt(localStorage.getItem('mathGarageKP')) || 0;
        let garage = JSON.parse(localStorage.getItem('mathGarageCars')) || [];
        const marketCars = [
            { id: 1, brand: "Hot Wheels", name: "Mainline Mustang", price: 150, image: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?w=400&q=80&fit=crop" },
            { id: 2, brand: "Matchbox", name: "Moving Parts Porsche", price: 250, image: "https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?w=400&q=80&fit=crop" },
            { id: 3, brand: "Majorette", name: "Premium G-Class", price: 400, image: "https://images.unsplash.com/photo-1520031441872-265e4ff70366?w=400&q=80&fit=crop" },
            { id: 4, brand: "Siku", name: "Super Series BMW M4", price: 500, image: "https://images.unsplash.com/photo-1555353540-64fd1b6263b7?w=400&q=80&fit=crop" },
            { id: 5, brand: "Corgi", name: "Classics Aston Martin", price: 600, image: "https://images.unsplash.com/photo-1603584173870-7f23fdae4b7a?w=400&q=80&fit=crop" },
            { id: 6, brand: "Greenlight", name: "Hollywood Film Aracı", price: 800, image: "https://images.unsplash.com/photo-1581451528659-05206ee8bf10?w=400&q=80&fit=crop" },
            { id: 7, brand: "Jada", name: "Fast & Furious Skyline", price: 1000, image: "https://images.unsplash.com/photo-1611859266238-4b98091d9d9b?w=400&q=80&fit=crop" },
            { id: 8, brand: "Johnny Lightning", name: "Classic Muscle", price: 1200, image: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=400&q=80&fit=crop" },
            { id: 9, brand: "Mini GT", name: "Nissan GT-R R35", price: 1500, image: "https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=400&q=80&fit=crop" },
            { id: 10, brand: "Tarmac Works", name: "Global64 Audi R8", price: 1800, image: "https://images.unsplash.com/photo-1603507119253-1571556aa843?w=400&q=80&fit=crop" },
            { id: 11, brand: "Tomica", name: "Limited Vintage Neo", price: 2500, image: "https://images.unsplash.com/photo-1557008075-7f2c5efa4cfd?w=400&q=80&fit=crop" },
            { id: 12, brand: "Inno64", name: "Honda Civic Type-R", price: 3500, image: "https://images.unsplash.com/photo-1583122622582-d6aa5229c996?w=400&q=80&fit=crop" },
            { id: 13, brand: "M2 Machines", name: "Auto-Thentics Truck", price: 4000, image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400&q=80&fit=crop" },
            { id: 14, brand: "Hot Wheels", name: "Super Treasure Hunt", price: 5000, image: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=400&q=80&fit=crop" },
            { id: 15, brand: "Hot Wheels", name: "RLC Exclusive", price: 10000, image: "https://images.unsplash.com/photo-1542282088-fe8426682b8f?w=400&q=80&fit=crop" }
        ];
        const brands = ["Hot Wheels", "Matchbox", "Greenlight", "Mini GT", "Corgi", "Jada", "Siku", "Tomica", "Majorette", "Inno64"];
        function switchView(viewId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            el.classList.add('active');
            if(viewId === 'pazar') renderMarket();
            if(viewId === 'garaj') renderGarage();
        }
        let currentCorrectAnswer = 0;
        let currentPoints = 0;
        let answered = false;
        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function generateQuestion() {
            const types = [0, 1, 2, 3];
            const type = types[randInt(0, types.length - 1)];
            const brand = brands[randInt(0, brands.length - 1)];
            let qText = "", answer = 0, points = 0;
            if (type === 0) {
                let lengthCM = randInt(5, 9);
                let realLength = lengthCM * 64;
                qText = `Gerçek uzunluğu ${realLength} cm olan bir otomobilin 1/64 ölçekli ${brand} modeli kaç cm'dir?`;
                answer = lengthCM; points = 20;
            } else if (type === 1) {
                let cost = randInt(5, 20) * 10;
                let profitRate = randInt(1, 5) * 100;
                qText = `Bir hunter raftan ${cost} TL'ye aldığı nadir bir ${brand} modelini, pazarında %${profitRate} karla satıyor. Araç kaç TL'ye satılmıştır?`;
                answer = cost + (cost * (profitRate / 100)); points = 40;
            } else if (type === 2) {
                let rows = randInt(4, 8), cols = randInt(8, 15), displays = randInt(2, 4);
                qText = `Fotoblok sergileme ünitesinde ${rows} raf var, her raf ${cols} araç alıyor. Duvarına ${displays} adet asarsan toplam kaç araç sergileyebilirsin?`;
                answer = rows * cols * displays; points = 30;
            } else if (type === 3) {
                let cases = randInt(3, 10), perCase = randInt(2, 6) * 12;
                qText = `Mağazaya ${cases} koli ${brand} geldi. Her kolide ${perCase} adet araç var. Toplam kaç araç gelmiştir?`;
                answer = cases * perCase; points = 25;
            }
            return { qText, answer, points };
        }
        function generateOptions(correctAnswer) {
            let opts = new Set();
            opts.add(correctAnswer);
            while(opts.size < 4) {
                let diff = randInt(-3, 3);
                if (diff === 0) diff = 5;
                let wrong = correctAnswer < 20 ? correctAnswer + diff : (correctAnswer < 100 ? correctAnswer + (diff * 2) : correctAnswer + (diff * 10));
                if (wrong > 0) opts.add(wrong);
            }
            let arr = Array.from(opts);
            arr.sort(() => Math.random() - 0.5); 
            return arr;
        }
        function loadNewQuestion() {
            answered = false;
            document.getElementById('next-btn').style.display = 'none';
            const qData = generateQuestion();
            currentCorrectAnswer = qData.answer;
            currentPoints = qData.points;
            document.getElementById('q-text').innerText = qData.qText;
            const options = generateOptions(qData.answer);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
        }
        function checkAnswer(selected, btnElement) {
            if (answered) return;
            answered = true;
            const buttons = document.querySelectorAll('.option-btn');
            if (selected === currentCorrectAnswer) {
                btnElement.classList.add('correct');
                updateKP(currentPoints);
                showToast(`Doğru! +${currentPoints} KP`, 'var(--success)');
            } else {
                btnElement.classList.add('wrong');
                showToast('Yanlış Cevap!', 'var(--accent-color)');
                buttons.forEach(b => { if (parseInt(b.innerText) === currentCorrectAnswer) b.classList.add('correct'); });
            }
            document.getElementById('next-btn').style.display = 'block';
        }
        function updateKP(amount) {
            kp += amount;
            document.getElementById('score').innerText = kp;
            localStorage.setItem('mathGarageKP', kp);
            renderMarket();
        }
        function showToast(msg, color) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.color = color;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 1500);
        }
        function renderMarket() {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';
            marketCars.forEach(car => {
                const canAfford = kp >= car.price;
                const btnClass = canAfford ? 'buy-btn' : 'buy-btn disabled';
                grid.innerHTML += `
                    <div class="car-card">
                        <div>
                            <img src="${car.image}" class="car-image" alt="${car.name}">
                            <div class="car-brand">${car.brand}</div>
                            <div class="car-name">${car.name}</div>
                            <div style="font-weight: bold; color: var(--primary-color);">${car.price} KP</div>
                        </div>
                        <button class="${btnClass}" onclick="buyCar(${car.id})">
                            ${canAfford ? 'SATIN AL' : 'YETERSİZ KP'}
                        </button>
                    </div>
                `;
            });
        }
        function buyCar(id) {
            const car = marketCars.find(c => c.id === id);
            if (kp >= car.price) {
                updateKP(-car.price);
                garage.push({...car, buyDate: new Date()});
                localStorage.setItem('mathGarageCars', JSON.stringify(garage));
                showToast('Garaja Eklendi!', 'var(--primary-color)');
                renderGarage();
            }
        }
        function renderGarage() {
            const grid = document.getElementById('garage-grid');
            document.getElementById('total-cars').innerText = garage.length;
            grid.innerHTML = '';
            if (garage.length === 0) {
                grid.innerHTML = '<div class="empty-garage">Henüz hiç aracın yok. Soruları çöz, KP kazan ve pazar alanından ilk modelini al!</div>';
                return;
            }
            garage.slice().reverse().forEach((car, index) => {
                grid.innerHTML += `
                    <div class="car-card" style="border-color: var(--primary-color);">
                        <div>
                            <img src="${car.image}" class="car-image" alt="${car.name}">
                            <div class="car-brand">${car.brand}</div>
                            <div class="car-name">${car.name}</div>
                            <div style="font-size: 10px; color: var(--text-muted);">Araç #${garage.length - index}</div>
                        </div>
                    </div>
                `;
            });
        }
        function resetData() {
            if(confirm("Tüm puanların ve garajdaki araçların silinecek. Emin misin?")) {
                localStorage.removeItem('mathGarageKP');
                localStorage.removeItem('mathGarageCars');
                kp = 0; garage = [];
                document.getElementById('score').innerText = kp;
                renderMarket(); renderGarage();
                showToast('Veriler Sıfırlandı', 'var(--accent-color)');
            }
        }
        document.getElementById('score').innerText = kp;
        loadNewQuestion();
        renderMarket();
        renderGarage();
    </script>
</body>
</html>
